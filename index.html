<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Shooter 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; cursor: crosshair; }
        #canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #health { margin: 10px 0; }
        #kills { margin: 10px 0; }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
            font-size: 28px;
        }
        #gameOver button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #gameOver button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="health">Health: <span id="healthVal">100</span></div>
        <div id="kills">Enemies: <span id="killsVal">0</span></div>
        <div id="soundStatus">Audio: <span id="soundVal">🔊 ON</span> (Press M to toggle)</div>
        <div id="info">WASD move | ARROWS rotate | MOUSE aim | LEFT CLICK shoot | RIGHT DRAG view | M mute | ESC pause</div>
    </div>
    <div id="pauseMenu" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: white; padding: 30px 50px; border-radius: 10px; text-align: center; display: none; z-index: 100; font-size: 28px;">
        <div>PAUSED</div>
        <div style="font-size: 16px; margin-top: 10px; color: #aaa;">Tekan ESC untuk lanjut</div>
    </div>
    <div id="gameOver">
        <div id="gameOverText"></div>
        <button onclick="location.reload()">Restart</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
